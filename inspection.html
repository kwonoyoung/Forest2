<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수목 현장 점검 | 트리샘</title>
<meta name="description" content="현장 사진, GPS, 점검일지를 모바일에서 바로 기록하는 트리샘 수목 현장 점검 페이지입니다.">
<meta name="theme-color" content="#174b3b">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#26332d;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.topbar{background:#174b3b;color:#fff}.topbar .wrap{width:min(860px,92%);margin:auto;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:800}.nav{display:flex;gap:8px}.nav a{padding:8px 11px;border:1px solid rgba(255,255,255,.3);border-radius:8px;font-size:13px}.page{width:min(860px,92%);margin:24px auto 64px}.hero,.panel{border:1px solid #d9e5de;border-radius:16px;background:#fff}.hero{padding:24px;background:linear-gradient(135deg,#edf6f1,#fff)}.hero h1{margin:0 0 8px;color:#174b3b;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;color:#5e6a64;line-height:1.7}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}.step{padding:10px 6px;text-align:center;border-radius:10px;background:#fff;border:1px solid #dfe7e2;font-size:12px;font-weight:700;color:#446156}.panel{margin-top:18px;padding:20px;box-shadow:0 8px 26px rgba(23,75,59,.055)}.panel h2{margin:0 0 16px;color:#174b3b;font-size:20px}.field{display:block;margin-bottom:15px}.field>span{display:block;margin-bottom:7px;font-weight:800}.field small,.media-box small{display:block;margin-top:6px;color:#738078;line-height:1.5}.control{width:100%;min-height:48px;padding:10px 12px;border:1px solid #cbd6d0;border-radius:10px;background:#fff}.control:focus{outline:3px solid #d7ece2;border-color:#67947f}textarea.control{min-height:105px;resize:vertical}.tree-search{display:grid;grid-template-columns:1fr auto;gap:8px}.tree-search button,.btn{min-height:46px;padding:0 16px;border:1px solid #b7c8bf;border-radius:10px;background:#fff;color:#24473a;font-weight:800;cursor:pointer}.btn.primary{background:#18533f;border-color:#18533f;color:#fff}.btn.soft{background:#eef5f1}.btn:disabled{opacity:.5;cursor:not-allowed}.tree-list{max-height:240px;overflow:auto;margin-top:8px;border:1px solid #dce5df;border-radius:10px;background:#fafcfb}.tree-item{display:flex;align-items:center;width:100%;padding:12px;border:0;border-bottom:1px solid #e9eeeb;background:transparent;text-align:left;cursor:pointer}.tree-item:last-child{border-bottom:0}.tree-item:hover,.tree-item.selected{background:#eaf5ef}.tree-item b{color:#174b3b}.tree-item small{color:#6a766f}.selected-tree{display:none;margin-top:10px;padding:12px;border-radius:10px;background:#eaf8ef;color:#17613a;font-weight:800}.selected-tree.show{display:block}.status-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status-option input{position:absolute;opacity:0}.status-option span{display:flex;min-height:46px;align-items:center;justify-content:center;border:1px solid #ccd8d1;border-radius:10px;font-weight:800;cursor:pointer}.status-option input:checked+span{background:#174b3b;color:#fff;border-color:#174b3b}.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.media-box{padding:14px;border:1px dashed #b8c9c0;border-radius:12px;background:#fbfdfc}.media-box h3{margin:0 0 10px;font-size:15px;color:#174b3b}.preview{display:none;width:100%;max-height:250px;object-fit:cover;margin-top:10px;border-radius:10px}.preview.show{display:block}.gps-row{display:flex;gap:8px;flex-wrap:wrap}.gps-value{flex:1;min-width:220px;min-height:46px;padding:12px;border-radius:10px;background:#f3f6f4;border:1px solid #dce5df}.savebar{position:sticky;bottom:0;margin-top:20px;padding:12px;background:rgba(244,247,245,.94);backdrop-filter:blur(8px);border-radius:14px}.savebar .btn{width:100%;min-height:52px;font-size:17px}.message{display:none;margin-top:12px;padding:12px;border-radius:10px;line-height:1.55}.message.show{display:block}.message.ok{background:#eaf8ef;color:#156036}.message.error{background:#fff0f0;color:#9a2323}.footer{text-align:center;padding:28px 10px;color:#7a857f;font-size:12px}@media(max-width:650px){.topbar .wrap{padding:11px 0;align-items:flex-start;flex-direction:column}.steps{gap:5px}.step{font-size:10px;padding:8px 3px}.panel{padding:16px}.media-grid{grid-template-columns:1fr}.tree-search{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
</head>
<body>
<header class="topbar"><div class="wrap"><a class="brand" href="./">🌳 트리샘</a><nav class="nav"><a href="./">첫 화면</a><a href="dashboard/">관리대장</a></nav></div></header>
<main class="page">
<section class="hero"><h1>수목 현장 점검</h1><p>현장에서 수목을 선택하고 사진·GPS·점검내용을 바로 기록합니다.</p><div class="steps"><div class="step">① 수목 선택</div><div class="step">② 사진 촬영</div><div class="step">③ 상태 선택</div><div class="step">④ GPS 확인</div><div class="step">⑤ 저장</div></div></section>
<form id="inspectionForm">
<section class="panel"><h2>1. 점검 수목 선택</h2><div class="tree-search"><input id="treeSearch" class="control" type="search" placeholder="수목명 또는 대장번호 검색" autocomplete="off"><button type="button" id="refreshTrees">목록 새로고침</button></div><div id="selectedTree" class="selected-tree"></div><div id="treeList" class="tree-list"></div></section>
<section class="panel"><h2>2. 점검 내용</h2><label class="field"><span>점검일자 *</span><input id="inspectionDate" class="control" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" pattern="\d{4}-\d{2}-\d{2}" required></label><label class="field"><span>점검자 *</span><input id="inspector" class="control" type="text" placeholder="예: 홍길동" required></label><div class="field"><span>점검상태 *</span><div class="status-options"><label class="status-option"><input type="radio" name="inspectionStatus" value="양호" checked><span>양호</span></label><label class="status-option"><input type="radio" name="inspectionStatus" value="주의"><span>주의</span></label><label class="status-option"><input type="radio" name="inspectionStatus" value="위험"><span>위험</span></label></div></div><label class="field"><span>점검조치</span><input id="inspectionAction" class="control" type="text" placeholder="예: 전정 및 지주목 보강"></label><label class="field"><span>특이사항</span><textarea id="notes" class="control" placeholder="점검 중 확인한 내용을 입력하세요."></textarea></label></section>
<section class="panel"><h2>3. 현장 사진·GPS</h2><div class="media-grid"><div class="media-box"><h3>📷 나무 상태사진</h3><input id="photoInput" type="file" accept="image/*" capture="environment"><img id="photoPreview" class="preview" alt="상태사진 미리보기"><small>스마트폰에서는 카메라 촬영 또는 사진 선택이 가능합니다. 최대 8MB.</small></div><div class="media-box"><h3>📍 현장 위치</h3><div class="gps-row"><div id="gpsValue" class="gps-value">GPS 위치를 아직 가져오지 않았습니다.</div><button class="btn soft" type="button" id="gpsButton">현재 위치 가져오기</button></div><small>저장 시 좌표가 특이사항에 함께 기록됩니다.</small></div></div></section>
<div id="message" class="message" role="status" aria-live="polite"></div><div class="savebar"><button id="saveButton" class="btn primary" type="submit">점검일지 저장</button></div>
</form></main><footer class="footer">© 2026 TreeSam Smart Management System.</footer>
<script>
(()=>{'use strict';const client=window.forestSupabase,TEST_ACCOUNT={email:'kwonoyoung77+treesam-test@gmail.com',password:'treesam-test-2026'},PHOTO_BUCKET='demo-tree-photos',MB=1024*1024,$=id=>document.getElementById(id),state={trees:[],selected:null,gps:null,photo:null,loading:false};const pad=n=>String(n).padStart(2,'0'),localDate=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,type='ok'){const e=$('message');e.textContent=t;e.className='message show '+type}function clearMsg(){$('message').className='message'}function describe(e){const m=String(e?.message||e||'오류가 발생했습니다.');if(/row-level security|permission denied|not allowed/i.test(m))return'저장 권한이 없습니다. 로그인 상태를 확인해 주세요.';if(/network|failed to fetch/i.test(m))return'데이터 서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.';return m}async function ensureAuth(){if(!client)throw new Error('데이터베이스 연결을 준비하지 못했습니다.');const{data}=await client.auth.getSession();if(data?.session)return;let{error}=await client.auth.signInWithPassword(TEST_ACCOUNT);if(error&&/invalid login credentials/i.test(error.message)){const r=await client.auth.signUp(TEST_ACCOUNT);if(r.error&&!/already registered/i.test(r.error.message))throw r.error;if(!r.data?.session){const s=await client.auth.signInWithPassword(TEST_ACCOUNT);error=s.error}else error=null}if(error)throw error}function renderTrees(){const q=$('treeSearch').value.trim().toLowerCase(),list=!q?state.trees:state.trees.filter(t=>((t.name||'')+' '+(t.asset_no||'')).toLowerCase().includes(q));$('treeList').innerHTML=list.length?list.map(t=>`<button type="button" class="tree-item${state.selected?.id===t.id?' selected':''}" data-id="${esc(t.id)}"><span><b>${esc(t.name||'-')}</b><br><small>${esc(t.asset_no||'-')} · ${esc(t.detailed_location||t.organization_name||'위치 미등록')}</small></span></button>`).join(''):'<div style="padding:18px;text-align:center;color:#6d7972">검색 결과가 없습니다.</div>';const s=$('selectedTree');if(state.selected){s.innerHTML='선택 수목: '+esc(state.selected.name||'-')+' <small>('+esc(state.selected.asset_no||'-')+')</small>';s.classList.add('show')}else{s.textContent='';s.classList.remove('show')}}async function loadTrees(){clearMsg();$('treeList').innerHTML='<div style="padding:18px;text-align:center">수목 목록을 불러오는 중입니다.</div>';try{await ensureAuth();const{data,error}=await client.from('demo_trees').select('id,asset_no,name,organization_name,detailed_location').order('asset_no');if(error)throw error;state.trees=data||[];renderTrees()}catch(e){$('treeList').innerHTML='<div style="padding:18px;text-align:center;color:#9a2323">목록을 불러오지 못했습니다.</div>';msg(describe(e),'error')}}$('treeList').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;state.selected=state.trees.find(t=>t.id===b.dataset.id)||null;renderTrees()});$('treeSearch').addEventListener('input',renderTrees);$('refreshTrees').addEventListener('click',loadTrees);$('inspectionDate').value=localDate();$('photoInput').addEventListener('change',()=>{const f=$('photoInput').files?.[0]||null;if(f&&f.size>8*MB){$('photoInput').value='';state.photo=null;msg('사진은 8MB 이하만 등록할 수 있습니다.','error');return}state.photo=f;const p=$('photoPreview');if(f){p.src=URL.createObjectURL(f);p.classList.add('show')}else{p.removeAttribute('src');p.classList.remove('show')}});$('gpsButton').addEventListener('click',()=>{clearMsg();if(!navigator.geolocation){msg('이 브라우저에서는 GPS 위치 기능을 사용할 수 없습니다.','error');return}$('gpsValue').textContent='현재 위치를 확인하는 중입니다…';navigator.geolocation.getCurrentPosition(pos=>{state.gps={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};$('gpsValue').textContent=`위도 ${state.gps.lat.toFixed(6)}, 경도 ${state.gps.lng.toFixed(6)} (정확도 약 ${Math.round(state.gps.accuracy)}m)`},err=>{state.gps=null;$('gpsValue').textContent='GPS 위치를 가져오지 못했습니다.';msg(err.code===1?'브라우저의 위치 권한을 허용해 주세요.':'현재 위치를 확인하지 못했습니다.','error')},{enableHighAccuracy:true,timeout:12000,maximumAge:0})});async function uploadPhoto(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',visitor=window.forestDemoVisitor||'inspection',path=visitor+'/'+crypto.randomUUID()+'.'+ext,r=await client.storage.from(PHOTO_BUCKET).upload(path,file,{contentType:file.type||undefined,upsert:false});if(r.error)throw r.error;return{path,url:client.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl}}$('inspectionForm').addEventListener('submit',async e=>{e.preventDefault();clearMsg();if(state.loading)return;if(!state.selected){msg('점검할 수목을 먼저 선택해 주세요.','error');return}const date=$('inspectionDate').value.trim(),inspector=$('inspector').value.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){msg('점검일자는 YYYY-MM-DD 형식으로 입력해 주세요.','error');return}if(!inspector){msg('점검자를 입력해 주세요.','error');return}state.loading=true;$('saveButton').disabled=true;$('saveButton').textContent='저장 중…';try{await ensureAuth();let uploaded=null;if(state.photo){$('saveButton').textContent='사진 업로드 중…';uploaded=await uploadPhoto(state.photo)}let notes=$('notes').value.trim();if(state.gps){const g=`[현장 GPS] ${state.gps.lat.toFixed(6)}, ${state.gps.lng.toFixed(6)} / 정확도 약 ${Math.round(state.gps.accuracy)}m`;notes=notes?notes+'\n'+g:g}const payload={tree_id:state.selected.id,inspection_date:date,inspector,inspection_status:document.querySelector('input[name="inspectionStatus"]:checked').value,inspection_action:$('inspectionAction').value.trim()||null,notes:notes||null};if(uploaded){payload.state_photo_url=uploaded.url;payload.state_photo_path=uploaded.path}const{error}=await client.from('demo_tree_management_logs').insert(payload);if(error)throw error;msg(`${state.selected.name||'수목'} 점검일지를 저장했습니다.`,'ok');$('inspectionAction').value='';$('notes').value='';$('photoInput').value='';$('photoPreview').removeAttribute('src');$('photoPreview').classList.remove('show');state.photo=null;state.gps=null;$('gpsValue').textContent='GPS 위치를 아직 가져오지 않았습니다.';window.scrollTo({top:0,behavior:'smooth'})}catch(err){msg('점검일지를 저장하지 못했습니다: '+describe(err),'error')}finally{state.loading=false;$('saveButton').disabled=false;$('saveButton').textContent='점검일지 저장'}});loadTrees()})();
</script>
</body></html>
