<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>트리샘 관리자 로그인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#123f32,#2f6f57);font-family:Arial,'Noto Sans KR',sans-serif;color:#26332e}.shell{width:min(440px,calc(100% - 32px));background:#fff;border-radius:20px;padding:34px;box-shadow:0 24px 70px #06221966}.brand{display:flex;align-items:center;gap:12px;color:#195441;font-size:25px;font-weight:800;text-decoration:none}.brand i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eaf4ed;font-style:normal}.desc{margin:18px 0 26px;color:#68726d;line-height:1.65}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f3f1;border-radius:10px;padding:4px;margin-bottom:20px}.tabs button{height:38px;border:0;border-radius:8px;background:transparent;color:#617068;cursor:pointer}.tabs button.active{background:#fff;color:#174b3b;font-weight:700;box-shadow:0 2px 9px #173d2f1a}label{display:block;font-size:13px;font-weight:700;margin:14px 0 0}input{width:100%;height:46px;margin-top:7px;border:1px solid #d7ded9;border-radius:9px;padding:0 12px;font:inherit;outline:none}input:focus{border-color:#2c7458;box-shadow:0 0 0 3px #2c74581a}.primary{width:100%;height:48px;margin-top:22px;border:0;border-radius:9px;background:#195441;color:#fff;font-weight:700;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.notice{display:none;margin-top:16px;padding:12px;border-radius:8px;font-size:13px;line-height:1.5}.notice.ok{display:block;background:#eaf8ef;color:#126d39}.notice.error{display:block;background:#fff0f0;color:#b42323}.help{font-size:12px;color:#7b837f;line-height:1.6;margin:18px 0 0}.back{display:block;margin-top:22px;text-align:center;color:#356c57;font-size:13px;text-decoration:none}
  </style>
</head>
<body>
  <main class="shell">
    <a class="brand" href="../"><i>◒</i> 트리샘</a>
    <p class="desc">스마트 입목죽 관리 시스템에 로그인하세요.</p>
    <div class="tabs"><button id="loginTab" class="active" type="button">로그인</button><button id="signupTab" type="button">계정 등록</button></div>
    <form id="authForm">
      <label id="nameField" hidden>이름<input id="fullName" autocomplete="name" placeholder="관리자 이름"></label>
      <label>이메일<input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
      <label>비밀번호<input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="6자 이상"></label>
      <button id="submitButton" class="primary">로그인</button>
    </form>
    <div id="notice" class="notice" role="status"></div>
    <p class="help">신규 계정은 조회 전용으로 등록됩니다. 관리자 권한은 승인 후 부여됩니다.</p>
    <a class="back" href="../">← 첫 화면으로</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    const client=window.forestSupabase;let mode='login';
    const form=document.getElementById('authForm'),notice=document.getElementById('notice'),submitButton=document.getElementById('submitButton');
    function setMode(next){mode=next;loginTab.classList.toggle('active',mode==='login');signupTab.classList.toggle('active',mode==='signup');nameField.hidden=mode==='login';submitButton.textContent=mode==='login'?'로그인':'계정 등록';password.autocomplete=mode==='login'?'current-password':'new-password';notice.className='notice';notice.textContent=''}
    function show(message,type='error'){notice.textContent=message;notice.className='notice '+type}
    loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');
    form.onsubmit=async event=>{event.preventDefault();submitButton.disabled=true;notice.className='notice';try{if(mode==='signup'){const {data,error}=await client.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:fullName.value.trim()}}});if(error)throw error;if(data.session){location.replace('../dashboard/')}else show('가입 확인 이메일을 보냈습니다. 이메일 확인 후 로그인해 주세요.','ok')}else{const {error}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;location.replace('../dashboard/')}}catch(error){show(error.message||'요청을 처리하지 못했습니다.')}finally{submitButton.disabled=false}};
    client.auth.getSession().then(({data})=>{if(data.session)location.replace('../dashboard/')});
  </script>
</body>
</html>
